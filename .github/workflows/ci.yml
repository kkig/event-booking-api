name: "CI"

on:
  push:
    branches: [master, epic/**]
  pull_request:
    branches: [master, epic/**]

# Cancels duplicate workflow runs for the same ref and workflow name.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # Cache uv downloads and build artifacts between workflow runs.
          enable-cache: true
          version: "0.12.23"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --project backend --frozen --dev

      - name: Run pre-commit hooks
        run: uv run --project backend --frozen pre-commit run --all-files
