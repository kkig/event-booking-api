services:
  web:
    build:
      target: development

    ports:
      - "8000:8000"

    volumes:
      - .:/workspace

    environment:
      # Devcontainer settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    command: >
      uv run python manage.py runserver 0.0.0.0:8000

  db:
    ports:
      # Host-side development / pytest
      - "5433:5432"
