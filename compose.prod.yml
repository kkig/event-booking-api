services:
  web:
    build:
      target: production

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}

    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4

  db:
    # Replace with an external database service
    restart: unless-stopped
