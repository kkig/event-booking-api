services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.4

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
